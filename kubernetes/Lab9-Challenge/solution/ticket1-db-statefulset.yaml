apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: legacy-db-sts
  namespace: lab9-challenge
spec:
  serviceName: "legacy-db-headless"
  replicas: 2
  selector:
    matchLabels:
      app: legacy-db
  template:
    metadata:
      labels:
        app: legacy-db
    spec:
      containers:
      - name: mongo
        image: mongo:5.0
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: data
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
