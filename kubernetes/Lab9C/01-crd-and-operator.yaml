apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mongoclusters.database.example.com
spec:
  group: database.example.com
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                members:
                  type: integer
                  minimum: 1
                  maximum: 5
                version:
                  type: string
                storageSize:
                  type: string
                autoFailover:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                primaryPod:
                  type: string
  scope: Namespaced
  names:
    plural: mongoclusters
    singular: mongocluster
    kind: MongoCluster
    shortNames:
    - mc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-operator-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-operator
  template:
    metadata:
      labels:
        app: mongo-operator
    spec:
      containers:
      - name: operator
        image: nginx:alpine
        command: ["/bin/sh", "-c", "echo 'MongoOperator Controller active, monitoring CRD mongoclusters.database.example.com...'; while true; do sleep 30; done"]
